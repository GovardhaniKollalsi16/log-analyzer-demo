[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "incident-investigator-demo"
version = "0.1.0"
description = "Demo: AI-assisted incident investigation over synthetic (MOCK) distributed-system logs"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
mocklogs = "mocklogs.cli:main"
# `investigator` is added in M5, when its CLI exists.

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
